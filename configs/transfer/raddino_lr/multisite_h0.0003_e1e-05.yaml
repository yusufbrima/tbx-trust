# generated by scripts/experiments/raddino_learning_rate.sh from configs/transfer/multisite_raddino_from_shenzhen.yaml
name: multisite_raddino_from_shenzhen_h0.0003_e1e-05
seed: 42
paths:
  dataset: ${TBMXAI_MULTISITE:-~/data/tbmxai/tb_multisite}
  output_root: ${TBMXAI_OUTPUT_ROOT:-~/tbmxai_runs}
  image_cache: ${TBMXAI_IMAGE_CACHE:-~/data/tbmxai/cxr_cache}
output_dir: ${output_root}
data:
  dataset: ${dataset}
  label_column: tb
  use:
  - images
view:
  modalities:
  - imaging
  metadata_columns:
  - site
  - tbx_class
split:
  name: external
  params:
    column: site
    test_values:
    - montgomery
    - tbx11k
    val_size: 0.2
model:
  name: neural
  params:
    encoders:
      imaging:
        name: rad_dino
        params:
          model_name: microsoft/rad-dino
          size: 518
    head:
      dropout: 0.0705
    image:
      size: 512
      augment: true
      in_chans: 1
      cache_dir: ${image_cache}
      cache_size: 512
training:
  epochs: 40
  batch_size: 16
  num_workers: 4
  precision: bf16-mixed
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.00476
    encoder_lr_mult: 0.033333
  scheduler:
    name: cosine
    warmup_epochs: 2
    min_lr_ratio: 0.01
  early_stopping:
    monitor: val_loss
    patience: 8
  checkpoint:
    save_top_k: 1
    save_last: true
evaluation:
  n_bootstrap: 1000
  threshold_selection: sensitivity
  target_sensitivity: 0.9
subgroups:
  columns:
  - site
  - tbx_class
  min_size: 20
reporting:
  writers:
  - json
  - tables
  - markdown
  - html
  table_format: both
