# Shared-split variant: as configs/transfer/internal/ but with split_seed: 0, so all
# seeds share one Shenzhen train / validation / internal-test split and vary only initialisation and order.
# the exact config of nlm_tb_tuned/cxr_densenet_seeds (seed1/config.yaml) with a held-out Shenzhen
# internal test split (20 % of patients) reported alongside Montgomery; threshold = 90 % sensitivity
# on Shenzhen validation.
paths:
  dataset: ~/data/tbmxai/nlm_tb
  output_root: ~/tbmxai_runs
  image_cache: ~/data/tbmxai/cxr_cache
name: shared_densenet_imagenet
seed: 1
data:
  dataset: ~/data/tbmxai/nlm_tb
  use:
  - tabular
  - images
  sources: []
  patient_column: patient_id
  label_column: tb
  link_columns: []
  join: inner
  class_names: null
view:
  modalities:
  - imaging
  metadata_columns:
  - site
  - sex
  - age_group
  tabular_columns: null
  missing_modalities: drop
  index_policy: all
  index_time_column: null
split:
  name: external
  params:
    column: site
    test_values: montgomery
    val_size: 0.2
    internal_test_size: 0.2
    split_seed: 0
model:
  name: neural
  params:
    encoders:
      imaging:
        name: timm_vision
        params:
          backbone: densenet121
          pretrained: true
          drop_rate: 0.2
    head:
      dropout: 0.15810463178750356
    image:
      size: 384
      augment: true
      in_chans: 1
      cache_dir: ~/data/tbmxai/cxr_cache
      cache_size: 512
training:
  epochs: 40
  batch_size: 16
  eval_batch_size: null
  num_workers: 4
  device: auto
  precision: bf16-mixed
  accumulate_grad_batches: 1
  grad_clip_norm: 1.0
  class_weights: balanced
  label_smoothing: 0.0
  optimizer:
    name: adamw
    lr: 0.0009678316507834555
    weight_decay: 0.00700922628703353
    betas:
    - 0.9
    - 0.999
    momentum: 0.9
    nesterov: true
    encoder_lr_mult: 0.5311142056503079
  scheduler:
    name: cosine
    warmup_epochs: 2.0
    warmup_start_factor: 0.01
    min_lr_ratio: 0.01
    step_size: 10
    gamma: 0.1
    patience: 3
  early_stopping:
    enabled: true
    monitor: val_loss
    mode: auto
    patience: 8
    min_delta: 0.0
  checkpoint:
    enabled: true
    monitor: null
    mode: auto
    save_top_k: 1
    save_last: true
    restore_best: true
  resume_from: null
  deterministic: false
  log_every_n_steps: 50
evaluation:
  metrics: null
  threshold: 0.5
  threshold_selection: sensitivity
  target_sensitivity: 0.9
  target_specificity: 0.7
  calibration: none
  n_bootstrap: 1000
  confidence: 0.95
  bootstrap_unit: patient
  modality_ablation: false
  splits:
  - val
  - test
subgroups:
  columns:
  - sex
  - age_group
  min_size: 15
  bins: {}
explain:
  methods:
  - name: grad_cam
    params: {}
  - name: integrated_gradients
    params: {}
  - name: score_cam
    params:
      max_channels: 256
  samples:
    split: test
    n_per_class: 8
    seed: null
    file: null
  target_classes: all
reporting:
  writers:
  - json
  - tables
  - markdown
  - html
  save_predictions: true
  table_format: both
tuning:
  enabled: false
  n_trials: 30
  timeout_minutes: 90.0
  metric: auroc
  direction: auto
  sampler: tpe
  sampler_params: {}
  pruner: median
  pruner_params:
    n_startup_trials: 5
    n_warmup_steps: 5
  storage: null
  study_name: null
  search_space:
    model.params.encoders.imaging.params.backbone:
      type: categorical
      low: null
      high: null
      step: null
      log: false
      choices:
      - densenet121
      - resnet50
      - convnext_tiny
    model.params.image.size:
      type: categorical
      low: null
      high: null
      step: null
      log: false
      choices:
      - 256
      - 320
      - 384
    training.optimizer.lr:
      type: float
      low: 0.0001
      high: 0.001
      step: null
      log: true
      choices: null
    training.optimizer.weight_decay:
      type: float
      low: 0.0001
      high: 0.1
      step: null
      log: true
      choices: null
    training.optimizer.encoder_lr_mult:
      type: float
      low: 0.03
      high: 1.0
      step: null
      log: true
      choices: null
    model.params.head.dropout:
      type: float
      low: 0.0
      high: 0.5
      step: null
      log: false
      choices: null
  n_jobs: 1
protocol:
  path: null
  use_split: true
  use_xai_samples: true
