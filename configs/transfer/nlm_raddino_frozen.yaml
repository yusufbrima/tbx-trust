# Shenzhen -> Montgomery with a public CXR foundation model: RAD-DINO ViT-B/14 (Microsoft), frozen (linear head).
# Same training settings as configs/nlm_tb/cxr_convnext.yaml; reference baseline for MIMIC pretraining.
# Data: bash scripts/nlm_tb/01_download.sh && bash scripts/nlm_tb/02_build.sh
name: nlm_tb_raddino_frozen
seed: 42
paths:
  dataset: ${TBMXAI_NLM_TB:-~/data/tbmxai/nlm_tb}
  output_root: ${TBMXAI_OUTPUT_ROOT:-~/tbmxai_runs}
  image_cache: ${TBMXAI_IMAGE_CACHE:-~/data/tbmxai/cxr_cache}
output_dir: ${output_root}

data:
  dataset: ${dataset}
  label_column: tb
  use: [tabular, images]          # same samples for every NLM model

view:
  modalities: [imaging]
  metadata_columns: [site, sex, age_group]

split:
  name: external                  # test = every Montgomery image; Shenzhen → train / val
  params: {column: site, test_values: montgomery, val_size: 0.2}

model:
  name: neural
  params:
    encoders:
      imaging:
        name: rad_dino
        params: {model_name: microsoft/rad-dino, size: 518, freeze: true}
    head: {dropout: 0.0705}
    image: {size: 512, augment: true, in_chans: 1, cache_dir: "${image_cache}", cache_size: 512}

training:
  epochs: 40
  batch_size: 16
  num_workers: 4
  precision: bf16-mixed
  optimizer: {name: adamw, lr: 7.55e-4, weight_decay: 0.00476, encoder_lr_mult: 0.129}
  scheduler: {name: cosine, warmup_epochs: 2, min_lr_ratio: 0.01}
  early_stopping: {monitor: val_loss, patience: 8}   # val loss: less noisy than AUROC on 133 images
  checkpoint: {save_top_k: 1, save_last: true}


evaluation:
  n_bootstrap: 1000
  threshold_selection: youden   # operating point chosen on Shenzhen validation, applied to Montgomery

# bash scripts/nlm_tb/04_tune.sh  (or: tbmxai tune configs/nlm_tb/cxr_densenet.yaml)
# Trials train on Shenzhen-train and are scored on Shenzhen-validation; Montgomery is used once,
# after refitting the best parameters.
